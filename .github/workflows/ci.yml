name: CI

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: actryn_test
          POSTGRES_USER: actryn_test
          POSTGRES_PASSWORD: actryn_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U actryn_test -d actryn_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      ACTOR_TEST_DATABASE_URL: postgresql://actryn_test:actryn_test@127.0.0.1:5432/actryn_test
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Test default features
        run: cargo test --workspace --all-targets

      - name: Test all features with PostgreSQL
        run: cargo test --workspace --all-targets --all-features -- --test-threads=1

      - name: Check SQLite protocol
        run: python3 checks/sqlite_protocol_check.py

      - name: Check cluster lease protocol
        run: python3 checks/cluster_lease_check.py

      - name: Build documentation
        run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D rustdoc::broken_intra_doc_links
